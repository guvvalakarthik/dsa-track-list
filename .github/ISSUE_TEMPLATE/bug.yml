name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, browser cookies, passwords, or private data."
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Start...\n2. Open...\n3. Observe..."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Dashboard, API, Browser extension, Database or migrations, Docker or operations, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "git rev-parse --short HEAD"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Python/Node versions, database, and deployment mode.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or request ID
      render: shell